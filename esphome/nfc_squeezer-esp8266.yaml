esphome:
  name: nfc-squeezer
  friendly_name: nfc-squeezer

esp8266:
  board: nodemcuv2
  framework:
    version: recommended

logger:
  level: DEBUG

# use components from a local folder
external_components:
  - source:
      type: local
      path: components

# The LMS Connection Configuration (external component)
lms:
  # uniqie id
  id: slimserver
  # server that hosts the LMS
  server: !secret lms_server
  # LMS client/player to control
  player: "office-mini (squeezelite)"
  #player: "Gameroom"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: True

web_server:
  # Include CSS and JS directly to avoid needing Internet
  local: true

# A restart button for help debugging
switch:
  - platform: restart
    name: "RFID Squeezer Restart"

light:
  - platform: neopixelbus
    variant: WS2812
    pin: GPIO3  # 8266 DMA only available on GPIO3, reduces flicker
    num_leds: 1
    type: RGB
    id: status_led
    name: "Status LED"
    method:
      type: esp8266_dma

# Text for display in web and HomeAssistant
text_sensor:
  - platform: template
    id: rfid_tag
    name: "RFID Tag"

# I2C for RFID Reader
i2c:
  sda: GPIO04
  scl: GPIO05
  scan: true
  id: bus_a

# RFID Reader Actions
pn532_i2c:
  update_interval: 1s
  on_tag:
    then:
    - light.turn_on:
        id: status_led
        brightness: 50%
        red: 0
        green: 1
        blue: 0
    - text_sensor.template.publish:
        id: rfid_tag
        state: !lambda 'return x;'
    - lambda: |-
        auto lms = id(slimserver);
        lms->send_tag(x.c_str());
  on_tag_removed:
      then:
      - light.turn_off:
          id: status_led
      - text_sensor.template.publish:
          id: rfid_tag
          state: 'None'
      - lambda: |-
          auto lms = id(slimserver);
          lms->send_tag_removed();
